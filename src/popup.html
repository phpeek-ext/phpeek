<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#636c76; --line:#e6e8eb;
          --red-bg:#fde8e6; --red:#a50e0e; --green-bg:#e6f4ea; --green:#137333;
          --amber-bg:#fef3d6; --amber:#8a5300; --grey-bg:#f1f3f4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --fg:#e8eaed; --muted:#9aa0a6; --line:#2a2e35;
            --red-bg:#3c1614; --red:#f6aea9; --green-bg:#11301c; --green:#81c995;
            --amber-bg:#3a2a08; --amber:#fdd663; --grey-bg:#23262c; }
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; width: 320px;
         margin: 0; padding: 14px; background: var(--bg); color: var(--fg); }
  header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  header img { width:28px; height:28px; }
  header h1 { font-size:15px; margin:0; letter-spacing:.2px;
              background:linear-gradient(90deg,#7c3aed,#ec4899); -webkit-background-clip:text;
              background-clip:text; color:transparent; }
  header small { display:block; font-size:11px; color:var(--muted); }
  .status { padding:10px 12px; border-radius:8px; font-weight:600; margin-bottom:12px; }
  #tell { display:block; width:100%; margin:12px 0 0; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
          background:transparent; color:var(--fg); font:inherit; font-weight:600; cursor:pointer; }
  #tell:hover { background:var(--grey-bg); }
  .guards { margin:12px 0 0; padding:10px 12px; border-radius:8px; background:var(--grey-bg); font-size:12px; }
  .guards b { display:block; margin-bottom:4px; color:var(--muted); font-weight:600; }
  .guards span { display:inline-block; margin-right:10px; }
  .guards span::before { content:"✓ "; color:#188038; font-weight:700; }
  .vulnerable, .eol { background:var(--red-bg); color:var(--red); }
  .patched { background:var(--green-bg); color:var(--green); }
  .unknown { background:var(--amber-bg); color:var(--amber); }
  .none { background:var(--grey-bg); color:var(--muted); }
  dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; }
  dt { color:var(--muted); }
  dd { margin:0; word-break:break-all; }
  p.note { color:var(--muted); font-size:12px; margin:10px 0 0; }
  .check { margin:12px 0 0; }
  .check b { display:block; margin-bottom:6px; font-size:12px; color:var(--muted); font-weight:600; }
  .check form { display:flex; gap:6px; }
  .check input { flex:1; min-width:0; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
                 background:var(--bg); color:var(--fg); font:inherit; }
  .check button { padding:8px 12px; border-radius:8px; border:0; background:#7c3aed; color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  .check button:disabled { opacity:.6; cursor:default; }
  #cres { margin-top:8px; }
  #cres .status { margin:0; font-size:12.5px; }
  #cres p { color:var(--muted); font-size:12px; margin:6px 0 0; }
  footer { margin-top:12px; padding-top:8px; border-top:1px solid var(--line);
           color:var(--muted); font-size:11px; }
</style>
</head>
<body>
  <header><img src="icons/icon-48.png" alt=""><div><h1>PHPeek</h1><small>Peek before you trust.</small></div></header>
  <div id="status" class="status none"></div>
  <dl id="details"></dl>
  <p class="note" id="note"></p>
  <button id="tell" hidden></button>
  <div class="guards"><b id="guardsTitle"></b><span id="gSeed"></span><span id="gSig"></span><span id="gClip"></span><span id="gCard"></span><span id="gPass"></span></div>
  <div class="check"><b id="checkTitle"></b>
    <form id="cform"><input id="curl" autocomplete="off" spellcheck="false" inputmode="url"><button id="cbtn" type="submit"></button></form>
    <div id="cres"></div>
  </div>
  <footer id="footer"></footer>
  <script src="popup.js"></script>
</body>
</html>
